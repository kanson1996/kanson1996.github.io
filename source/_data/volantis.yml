# Volantis overrides for Kanson's Blog

navbar:
  logo:
    img:
    icon: fa-solid fa-terminal
    title: Kanson's Blog
  menu:
    - name: 博客
      icon: fa-solid fa-rss
      url: /
    - name: 分类
      icon: fa-solid fa-folder-open
      url: categories/
    - name: 标签
      icon: fa-solid fa-tags
      url: tags/
    - name: 归档
      icon: fa-solid fa-archive
      url: archives/
    - name: 关于
      icon: fa-solid fa-info-circle
      url: about/
  search: 搜索文章...

cover:
  height_scheme: full
  layout_scheme: dock
  display:
    home: true
    archive: true
    others: false
  background: /images/cover.svg
  logo:
  title: Kanson's Blog
  subtitle: 想到并做到 · Hack the world
  search: 搜索文章...
  features:
    - name: 博客
      icon: fa-solid fa-rss
      url: /archives/
    - name: 关于
      icon: fa-solid fa-user
      url: /about/
    - name: GitHub
      icon: fab fa-github
      url: https://github.com/kanson1996

sidebar:
  position: right
  for:
    home: [blogger, webinfo, category, tagcloud, recent]
    post: [toc, webinfo, related, recent]
  widget_library:
    blogger:
      avatar: /images/avatar.png
      shape: circle
      url: /about/
      title: Kanson
      subtitle: 想到并做到
      social:
        - icon: fab fa-github
          url: https://github.com/kanson1996
        - icon: fa-solid fa-envelope
          url: mailto:kanson1996@gmail.com
    webinfo:
      type:
        article:
          enable: true
          text: '文章数目：'
          unit: '篇'
        runtime:
          enable: true
          data: '2017/07/14'
          text: '已运行时间：'
          unit: '天'
        wordcount:
          enable: true
          text: '本站总字数：'
          unit: '字'
        visitcounter:
          enable: true
          siteuv:
            text: '本站访客数：'
            unit: '人'
          sitepv:
            text: '本站总访问量：'
            unit: '次'
        lastupd:
          enable: true
    category:
      header:
        title: 文章分类
        url: /categories/
    tagcloud:
      header:
        title: 热门标签
        url: /tags/

article:
  body:
    top_meta: [author, category, date, wordcount, counter]
    bottom_meta: [tags, share]
    meta_library:
      author:
        avatar: /images/avatar.png
        name: Kanson
        url: /about/

plugins:
  wordcount:
    enable: true
  busuanzi:
    enable: true
  pjax:
    enable: false

comments:
  service: ''

search:
  enable: true
  service: hexo

site_footer:
  layout: [analytics, copyright]
  social:
    - icon: fab fa-github
      url: https://github.com/kanson1996
    - icon: fa-solid fa-envelope
      url: mailto:kanson1996@gmail.com
  copyright: 'Copyright © 2017 — <span id="copyright-year">2026</span> Kanson · Powered by [Hexo](https://hexo.io) & [Volantis](https://github.com/volantis-x/hexo-theme-volantis)'

cdn_system:
  system_config:
    custom:
      busuanzi: /js/bsz.js
